name: Claude warmup
on:
  schedule:
    - cron: '0 */5 * * *'   # every 5 hours, every day (00:00, 05:00, 10:00, 15:00, 20:00 UTC)
  workflow_dispatch:
jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @anthropic-ai/claude-code
      - run: echo "warmup" | claude -p
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
