name: Claude warmup
on:
  schedule:
    - cron: '0 6 * * 1-5'   # 6 AM UTC, weekdays, 5 hour cron job
  workflow_dispatch:
jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @anthropic-ai/claude-code
      - run: echo "warmup" | claude -p
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
